name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type destroy to confirm infrastructure deletion"
        required: true
        type: string
      delete_state_bucket:
        description: "Delete Terraform state bucket (not recommended)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Destroy and Verify Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Confirm destruction
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DELETE_STATE_BUCKET: ${{ inputs.delete_state_bucket }}
        run: |
          if [[ "$CONFIRMATION" != "destroy" ]]; then
            echo "Confirmation failed. Enter destroy."
            exit 1
          fi

          if [[ "$DELETE_STATE_BUCKET" == "true" ]]; then
            echo "State bucket deletion is not supported."
            exit 1
          fi

          echo "Destruction confirmed."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: ls -la terraform/environments/dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Capture resources before destroy
        working-directory: terraform/environments/dev
        run: terraform state list > "$RUNNER_TEMP/resources-before.txt"

      - name: Empty ECR repository
        run: |
          REPOSITORY="aws-ec2-autoscaling-devops-app"

          if aws ecr describe-repositories \
            --repository-names "$REPOSITORY" >/dev/null 2>&1; then

            while true; do
              IMAGE_IDS=$(aws ecr list-images \
                --repository-name "$REPOSITORY" \
                --query 'imageIds' \
                --output json)

              if [[ "$IMAGE_IDS" == "[]" || -z "$IMAGE_IDS" ]]; then
                echo "ECR repository is empty."
                break
              fi

              printf '%s' "$IMAGE_IDS" > "$RUNNER_TEMP/ecr-images.json"

              aws ecr batch-delete-image \
                --repository-name "$REPOSITORY" \
                --image-ids "file://$RUNNER_TEMP/ecr-images.json"
            done
          else
            echo "ECR repository is absent or inaccessible."
          fi

      - name: Terraform Destroy Plan
        working-directory: terraform/environments/dev
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Destroy Infrastructure
        id: destroy
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Capture remaining Terraform state
        if: always()
        working-directory: terraform/environments/dev
        run: |
          if terraform state list > "$RUNNER_TEMP/resources-after.txt" 2> "$RUNNER_TEMP/state-error.txt"; then
            echo "Terraform state inspected."
          else
            echo "Unable to inspect Terraform state."
            touch "$RUNNER_TEMP/resources-after.txt"
          fi

      - name: Generate destruction report
        if: always()
        env:
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"

          {
            echo "# Terraform Destroy Report"
            echo ""
            echo "- Region: $AWS_REGION"
            echo "- Destroy step: ${DESTROY_OUTCOME:-not completed}"
            echo "- Terraform state bucket: Preserved"
            echo ""
            echo "## Resources removed from Terraform state"
            echo ""
          } >> "$SUMMARY"

          if [[ -f "$RUNNER_TEMP/resources-before.txt" ]] &&
             [[ -f "$RUNNER_TEMP/resources-after.txt" ]]; then

            comm -23 \
              <(sort "$RUNNER_TEMP/resources-before.txt") \
              <(sort "$RUNNER_TEMP/resources-after.txt") \
              > "$RUNNER_TEMP/resources-removed.txt"

            if [[ -s "$RUNNER_TEMP/resources-removed.txt" ]]; then
              echo '```text' >> "$SUMMARY"
              cat "$RUNNER_TEMP/resources-removed.txt" >> "$SUMMARY"
              echo '```' >> "$SUMMARY"
            else
              echo "No resource addresses were removed from state." >> "$SUMMARY"
            fi

            echo "" >> "$SUMMARY"
            echo "## Resources remaining in Terraform state" >> "$SUMMARY"
            echo "" >> "$SUMMARY"

            if [[ -s "$RUNNER_TEMP/resources-after.txt" ]]; then
              echo '```text' >> "$SUMMARY"
              cat "$RUNNER_TEMP/resources-after.txt" >> "$SUMMARY"
              echo '```' >> "$SUMMARY"
            else
              echo "No resources are listed in Terraform state." >> "$SUMMARY"
            fi
          else
            echo "Terraform state comparison unavailable." >> "$SUMMARY"
          fi

          {
            echo ""
            echo "## AWS resource checks"
            echo ""
          } >> "$SUMMARY"

          check_aws() {
            local label="$1"
            shift
            local result

            if result=$("$@" 2>&1); then
              if [[ -z "$result" || "$result" == "None" || "$result" == "[]" ]]; then
                echo "- $label: No matching resource found." >> "$SUMMARY"
              else
                echo "- $label: Resource found or data returned:" >> "$SUMMARY"
                echo '```text' >> "$SUMMARY"
                echo "$result" >> "$SUMMARY"
                echo '```' >> "$SUMMARY"
              fi
            else
              echo "- $label: Check failed; inspect workflow logs." >> "$SUMMARY"
            fi
          }

          check_aws "Auto Scaling Group" \
            aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names aws-ec2-autoscaling-devops-asg \
            --query 'AutoScalingGroups[].AutoScalingGroupName' \
            --output text

          check_aws "ECR repository" \
            aws ecr describe-repositories \
            --repository-names aws-ec2-autoscaling-devops-app \
            --query 'repositories[].repositoryName' \
            --output text

          check_aws "Load balancers" \
            aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'aws-ec2-autoscaling-devops')].LoadBalancerName" \
            --output text

          check_aws "NAT Gateways" \
            aws ec2 describe-nat-gateways \
            --filter "Name=state,Values=pending,available,failed" \
            --query "NatGateways[].NatGatewayId" \
            --output text

          check_aws "Elastic IP addresses" \
            aws ec2 describe-addresses \
            --query "Addresses[].AllocationId" \
            --output text

          {
            echo ""
            echo "## Important notes"
            echo ""
            echo "- This report checks selected AWS resources, not every resource."
            echo "- Removal from Terraform state does not prove physical deletion."
            echo "- Check EC2 instances, EBS volumes, network interfaces, security groups, and other potentially chargeable resources."
            echo "- ECR images are permanently deleted by the cleanup step."
            echo "- The Terraform state bucket is intentionally preserved."
          } >> "$SUMMARY"