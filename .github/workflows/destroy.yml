name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type destroy to confirm infrastructure deletion"
        required: true
        type: string

      delete_state_bucket:
        description: "Delete Terraform state bucket (not recommended)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Destroy and Verify Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Confirm destruction
        env:
          CONFIRMATION: \${{ inputs.confirmation }}
          DELETE_STATE_BUCKET: \${{ inputs.delete_state_bucket }}
        run: |
          if [[ "\$CONFIRMATION" != "destroy" ]]; then
            echo "Confirmation failed. Enter destroy to continue."
            exit 1
          fi

          if [[ "\$DELETE_STATE_BUCKET" == "true" ]]; then
            echo "State bucket deletion is not supported."
            exit 1
          fi

          echo "Destruction confirmed."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          ls -la terraform/environments/dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: \${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: \${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Capture resources before destroy
        working-directory: terraform/environments/dev
        run: |
          terraform state list > "\$RUNNER_TEMP/resources-before.txt"
          echo "Resources tracked before destroy:"
          cat "\$RUNNER_TEMP/resources-before.txt"

      - name: Terraform Destroy Plan
        working-directory: terraform/environments/dev
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Destroy Infrastructure
        id: destroy
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Capture remaining Terraform state
        if: always()
        working-directory: terraform/environments/dev
        run: |
          if terraform state list > "\(RUNNER_TEMP/resources-after.txt" 2>"\)RUNNER_TEMP/state-error.txt"; then
            echo "State inspection completed."
          else
            echo "Unable to inspect Terraform state."
            touch "\$RUNNER_TEMP/resources-after.txt"
          fi

      - name: Generate destruction report
        if: always()
        env:
          DESTROY_OUTCOME: \${{ steps.destroy.outcome }}
        run: |
          SUMMARY="\$GITHUB_STEP_SUMMARY"

          {
            echo "# Terraform Destroy Report"
            echo ""
            echo "- **Region:** \$AWS_REGION"
            echo "- **Destroy result:** \${DESTROY_OUTCOME:-not completed}"
            echo "- **Terraform state bucket:** Preserved"
            echo ""
            echo "## Resources removed from Terraform state"
            echo ""
          } >> "\$SUMMARY"

          if [[ -f "\$RUNNER_TEMP/resources-before.txt" ]]; then
            if [[ -f "\$RUNNER_TEMP/state-error.txt" ]] &&
               [[ -s "\$RUNNER_TEMP/state-error.txt" ]]; then
              echo "Could not verify Terraform state after destroy." >> "\$SUMMARY"
            else
              comm -23 \
                <(sort "\$RUNNER_TEMP/resources-before.txt") \
                <(sort "\$RUNNER_TEMP/resources-after.txt") \
                > "\$RUNNER_TEMP/resources-removed.txt"

              if [[ -s "\$RUNNER_TEMP/resources-removed.txt" ]]; then
                echo '```text' >> "$SUMMARY"
                cat "$RUNNER_TEMP/resources-removed.txt" >> "$SUMMARY"
                echo '```' >> "\$SUMMARY"
              else
                echo "No resource addresses were removed from state." >> "\$SUMMARY"
              fi

              echo "" >> "\$SUMMARY"
              echo "## Resources remaining in Terraform state" >> "\$SUMMARY"
              echo "" >> "\$SUMMARY"

              if [[ -s "\$RUNNER_TEMP/resources-after.txt" ]]; then
                echo '```text' >> "$SUMMARY"
                cat "$RUNNER_TEMP/resources-after.txt" >> "$SUMMARY"
                echo '```' >> "\$SUMMARY"
              else
                echo "No resources are listed in the state." >> "\$SUMMARY"
              fi
            fi
          else
            echo "The pre-destroy resource list is unavailable." >> "\$SUMMARY"
          fi

          {
            echo ""
            echo "## AWS resource checks"
            echo ""
          } >> "\$SUMMARY"

          check_aws() {
            local label="\$1"
            shift
            local result

            if result=\(("\)@" 2>&1); then
              if [[ -z "\(result" \vert{}\vert{} "\)result" == "None" ]]; then
                echo "- **\$label:** No matching resource found." >> "\$SUMMARY"
              else
                echo "- **\$label:** Resource found or data returned:" >> "\$SUMMARY"
                echo '```text' >> "\$SUMMARY"
                echo "\(result" >> "\)SUMMARY"
                echo '```' >> "$SUMMARY"
              fi
            else
              echo "- **$label:** Check failed; inspect the logs." >> "$SUMMARY"
              echo "$result"
            fi
          }

          check_aws "Auto Scaling Group" \
            aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names aws-ec2-autoscaling-devops-asg \
            --query 'AutoScalingGroups[].AutoScalingGroupName' \
            --output text

          check_aws "ECR repository" \
            aws ecr describe-repositories \
            --repository-names aws-ec2-autoscaling-devops-app \
            --query 'repositories[].repositoryName' \
            --output text

          check_aws "Load balancers" \
            aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'aws-ec2-autoscaling-devops')].LoadBalancerName" \
            --output text

          check_aws "NAT Gateways" \
            aws ec2 describe-nat-gateways \
            --filter "Name=state,Values=pending,available,failed" \
            --query "NatGateways[?contains(NatGatewayId, 'nat-')].NatGatewayId" \
            --output text

          check_aws "Terraform state bucket" \
            aws s3api head-bucket \
            --bucket aws-ec2-autoscaling-devops-2026

          {
            echo ""
            echo "## Review before declaring cleanup complete"
            echo ""
            echo "- This report checks selected resources, not every AWS resource."
            echo "- Resources removed from Terraform state are not proof of physical deletion."
            echo "- Check EC2 instances, Elastic IPs, NAT Gateways, load balancers, EBS volumes, and other potentially chargeable resources in AWS."
            echo "- The ECR repository and images are deleted only if Terraform successfully manages and removes them."
            echo "- The Terraform state bucket is intentionally preserved."
          } >> "$SUMMARY"
