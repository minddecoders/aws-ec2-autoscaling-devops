name: "Terraform Plan"

on:
  workflow_dispatch:
    inputs:
      enable_compute:
        description: "Include EC2 Auto Scaling in the plan"
        required: true
        type: boolean
        default: false
      image_tag:
        description: "ECR image commit SHA (required if compute is enabled)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan development infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Validate inputs
        env:
          ENABLE_COMPUTE: ${{ inputs.enable_compute }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$ENABLE_COMPUTE" == "true" && -z "$IMAGE_TAG" ]]; then
            echo "Error: An image tag is required when compute is enabled."
            exit 1
          fi

      - name: Terraform Format Check
        # Fixed path traversal to safely check the entire project root
        run: terraform fmt -check -recursive ../../../

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          ENABLE_COMPUTE: ${{ inputs.enable_compute }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          terraform plan -input=false \
            -var="enable_compute=$ENABLE_COMPUTE" \
            -var="image_tag=$IMAGE_TAG"
